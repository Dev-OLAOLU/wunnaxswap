<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" fill="none">
  <!-- Subtle candlestick pattern tile for dark UI -->
  <g opacity="0.9">
    <!-- Bullish (cyan/green) -->
    <line x1="28" y1="40" x2="28" y2="200" stroke="#22d3ee" stroke-width="1.2" opacity="0.35"/>
    <rect x="20" y="70" width="16" height="90" rx="1" fill="#22d3ee" opacity="0.22"/>
    <line x1="68" y1="55" x2="68" y2="230" stroke="#34d399" stroke-width="1.2" opacity="0.3"/>
    <rect x="60" y="95" width="16" height="85" rx="1" fill="#34d399" opacity="0.2"/>
    <line x1="148" y1="30" x2="148" y2="190" stroke="#22d3ee" stroke-width="1.2" opacity="0.32"/>
    <rect x="140" y="55" width="16" height="100" rx="1" fill="#22d3ee" opacity="0.2"/>
    <line x1="228" y1="80" x2="228" y2="250" stroke="#34d399" stroke-width="1.2" opacity="0.28"/>
    <rect x="220" y="110" width="16" height="95" rx="1" fill="#34d399" opacity="0.18"/>
    <line x1="308" y1="45" x2="308" y2="210" stroke="#22d3ee" stroke-width="1.2" opacity="0.33"/>
    <rect x="300" y="75" width="16" height="88" rx="1" fill="#22d3ee" opacity="0.2"/>
    <line x1="388" y1="60" x2="388" y2="235" stroke="#34d399" stroke-width="1.2" opacity="0.28"/>
    <rect x="380" y="100" width="16" height="90" rx="1" fill="#34d399" opacity="0.18"/>
    <line x1="448" y1="50" x2="448" y2="200" stroke="#22d3ee" stroke-width="1.2" opacity="0.3"/>
    <rect x="440" y="80" width="16" height="80" rx="1" fill="#22d3ee" opacity="0.2"/>

    <!-- Bearish (red/pink) -->
    <line x1="108" y1="50" x2="108" y2="220" stroke="#f87171" stroke-width="1.2" opacity="0.32"/>
    <rect x="100" y="70" width="16" height="100" rx="1" fill="#f87171" opacity="0.16"/>
    <line x1="188" y1="35" x2="188" y2="205" stroke="#fb7185" stroke-width="1.2" opacity="0.3"/>
    <rect x="180" y="55" width="16" height="110" rx="1" fill="#fb7185" opacity="0.15"/>
    <line x1="268" y1="70" x2="268" y2="245" stroke="#f87171" stroke-width="1.2" opacity="0.28"/>
    <rect x="260" y="95" width="16" height="105" rx="1" fill="#f87171" opacity="0.15"/>
    <line x1="348" y1="40" x2="348" y2="215" stroke="#fb7185" stroke-width="1.2" opacity="0.3"/>
    <rect x="340" y="65" width="16" height="100" rx="1" fill="#fb7185" opacity="0.15"/>
    <line x1="428" y1="85" x2="428" y2="255" stroke="#f87171" stroke-width="1.2" opacity="0.26"/>
    <rect x="420" y="115" width="16" height="95" rx="1" fill="#f87171" opacity="0.14"/>
  </g>
  <!-- Soft grid -->
  <g opacity="0.12" stroke="#64748b" stroke-width="0.5">
    <line x1="0" y1="80" x2="480" y2="80"/>
    <line x1="0" y1="160" x2="480" y2="160"/>
    <line x1="0" y1="240" x2="480" y2="240"/>
  </g>
</svg>
