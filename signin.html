<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign In | Wunnaxswap</title>
  <meta name="theme-color" content="#F6F5F3" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="assets/css/main.css?v=markos1" />
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="card auth-box">
    <a class="brand auth-brand" href="/index.html"><span class="brand-mark">WX</span> Wunnaxswap</a>
    <h1>Sign in</h1>
    <p class="muted">Enter email and password. Success → home page.</p>

    <form id="signinForm">
      <div class="field">
        <label for="siEmail">Email</label>
        <input id="siEmail" type="email" required placeholder="you@email.com" autocomplete="username" />
      </div>
      <div class="field">
        <div class="field-label-row">
          <label for="siPass">Password</label>
          <a class="auth-forgot-link" href="/forgot-password.html">Forgot password?</a>
        </div>
        <input id="siPass" type="password" required placeholder="Your password" autocomplete="current-password" />
      </div>
      <p id="authError" class="auth-error" hidden role="alert"></p>
      <button class="btn btn-primary" style="width:100%" type="submit" id="siSubmit">Sign in</button>
    </form>

    <div class="auth-divider">or</div>

    <button type="button" class="btn btn-social google" id="btnGoogle" data-provider="google" style="width:100%">
      Continue with Google
    </button>

    <p class="muted" style="margin:1.15rem 0 0;text-align:center;font-size:.9rem">
      New here? <a href="/signup.html"><strong>Create an account</strong></a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/assets/js/firebase-config.js?v=otp4"></script>
<script src="/assets/js/backend.js?v=otp4"></script>
<!-- Dedicated login: success banner → force home -->
<script src="/assets/js/auth-page.js?v=otp4"></script>
<script src="/assets/js/email-otp.js?v=otp4"></script>
<script src="/assets/js/password-reset.js?v=otp4"></script>
</body>
</html>
