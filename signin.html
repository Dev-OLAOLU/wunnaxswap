<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In | Wunnaxswap</title>
  <meta name="description" content="Wunnaxswap — buy and sell crypto at competitive rates with arbitrage tools, swap, markets, and earn products." />
  <meta name="theme-color" content="#070b14" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="card auth-box">
    <div class="pill">Secure account access</div>
    <h1>Sign in to Wunnaxswap</h1>
    <p class="muted">Access wallets, trading tools, and your protected account area.</p>

    <div class="social-stack">
      <button type="button" class="btn btn-social google" id="btnGoogle" data-provider="google">
        <span class="ico" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.3 26.8 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.2 5.5l.1.1 6.3 5.3C39 40.3 44 36 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
        </span>
        Continue with Google
      </button>
      <button type="button" class="btn btn-social apple" id="btnApple" data-provider="apple">
        <span class="ico" aria-hidden="true">
          <svg width="16" height="18" viewBox="0 0 16 20" fill="currentColor"><path d="M13.3 10.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.5-.4 6.3 1 8.3.7 1 1.5 2.1 2.6 2 1 0 1.5-.7 2.7-.7s1.6.7 2.7.7c1.1 0 1.9-1 2.6-2 .8-1.1 1.1-2.2 1.1-2.3 0 0-2.1-.8-2.1-3.3zM11.1 4.3c.6-.7 1-1.7.9-2.7-0.9.1-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.5 1 .1 1.9-.4 2.5-1.1z"/></svg>
        </span>
        Continue with Apple
      </button>
      <button type="button" class="btn btn-social device" id="btnDevice" data-provider="device" hidden>
        <span class="ico" aria-hidden="true">🔐</span>
        <span id="deviceLabel">Sign in with this device</span>
      </button>
    </div>

    <div class="auth-divider">or use email</div>

    <form id="signinForm">
      <div class="field"><label>Email</label><input id="siEmail" type="email" required placeholder="you@email.com" autocomplete="username" /></div>
      <div class="field"><label>Password</label><input id="siPass" type="password" required placeholder="••••••••" autocomplete="current-password" /></div>
      <div class="checkline"><input type="checkbox" checked /> <span>Keep me signed in on this device</span></div>
      <button class="btn btn-primary" style="width:100%" type="submit">Continue with email</button>
    </form>
    <p class="muted" style="margin:1rem 0 0;font-size:.88rem">No account? <a href="signup.html">Create account</a></p>
    <p class="auth-note">Google &amp; Apple use a secure device-side demo flow in this build. Connect real OAuth Client IDs in production.</p>
  </div>
</div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/backend.js"></script>
<script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
