# Static site — skip Netlify post-processing (stops endless "Post processing" on drag-drop)
[build]
  publish = "."
  # Drag-and-drop ignores build; keep a no-op for linked Git deploys
  command = "true"

# CRITICAL: disables HTML/forms/asset post-processing that often hangs "In progress"
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
