[build]
  command = "echo static"
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

[build.environment]
  NODE_VERSION = "20"

# Proxy Firebase Auth onto this domain so browsers blocked from firebaseapp.com still work
[[redirects]]
  from = "/__/auth/*"
  to = "https://wunnaxswap.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
