# Git-linked static deploy + Firebase Auth proxy for Google login
# https://firebase.google.com/docs/auth/web/redirect-best-practices

[build]
  command = "echo static"
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.images]
  compress = false

[build.environment]
  NODE_VERSION = "20"

# Proxy Firebase Auth handler onto this domain (fixes Google redirect / 3rd-party cookies)
[[redirects]]
  from = "/__/auth/*"
  to = "https://wunnaxswap.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # Required so Google popup/redirect can talk back to this window
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
