<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset Password | Wunnaxswap</title>
  <meta name="theme-color" content="#070b14" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="card auth-box">
    <a class="brand auth-brand" href="/index.html"><span class="brand-mark">WX</span> Wunnaxswap</a>
    <h1>Set new password</h1>
    <p class="muted">Paste the reset code from your email (or open the email link — the code fills in automatically).</p>
    <p id="rpEmailHint" class="muted" style="margin:-.25rem 0 .85rem;font-size:.85rem" hidden></p>

    <div id="resetFormWrap">
      <form id="resetForm">
        <div class="field">
          <label for="rpCode">Reset code</label>
          <input id="rpCode" type="text" required placeholder="Code from email link (oobCode)" autocomplete="one-time-code" spellcheck="false" />
        </div>
        <div class="field">
          <label for="rpPass">New password</label>
          <input id="rpPass" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="rpPass2">Confirm new password</label>
          <input id="rpPass2" type="password" required minlength="6" placeholder="Same password again" autocomplete="new-password" />
        </div>
        <p id="authError" class="auth-error" hidden role="alert"></p>
        <button class="btn btn-primary" style="width:100%" type="submit" id="rpSubmit">Set new password</button>
      </form>
    </div>

    <div id="resetSuccess" hidden>
      <div class="auth-success" style="margin:0 0 1rem">
        <strong>Password updated</strong>
        <p style="margin:.5rem 0 0;font-size:.9rem">You can sign in with your new password.</p>
      </div>
      <a class="btn btn-primary" style="width:100%;display:inline-flex;justify-content:center;text-decoration:none;box-sizing:border-box" href="/signin.html">Go to sign in</a>
    </div>

    <p class="muted" style="margin:1.15rem 0 0;text-align:center;font-size:.9rem">
      Need a new code? <a href="/forgot-password.html"><strong>Send again</strong></a>
      · <a href="/signin.html">Sign in</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/assets/js/firebase-config.js?v=20260804d"></script>
<script src="/assets/js/backend.js?v=20260804d"></script>
<script src="/assets/js/password-reset.js?v=20260804d"></script>
</body>
</html>
