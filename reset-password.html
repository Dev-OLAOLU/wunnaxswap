<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reset Password | Wunnaxswap</title>
  <meta name="theme-color" content="#F6F5F3" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="assets/css/main.css?v=i18n1" />
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="card auth-box">
    <div class="auth-lang-row">
      <label class="wx-lang-wrap">
        <span class="wx-lang-caption" data-i18n="lang">Language</span>
        <select class="wx-lang-select" data-lang-select aria-label="Language">
          <option value="en">English (EN)</option>
          <option value="es">Español (ES)</option>
          <option value="fr">Français (FR)</option>
          <option value="zh">中文 (ZH)</option>
          <option value="ar">العربية (AR)</option>
          <option value="hi">हिन्दी (HI)</option>
          <option value="pt">Português (PT)</option>
          <option value="de">Deutsch (DE)</option>
          <option value="ja">日本語 (JA)</option>
          <option value="ko">한국어 (KO)</option>
        </select>
      </label>
    </div>
    <a class="brand auth-brand" href="/index.html"><span class="brand-mark">WX</span> Wunnaxswap</a>
    <h1>Set new password</h1>
    <p class="muted">Enter the <strong>6-digit code</strong> from your email, then choose a new password.</p>
    <p id="rpEmailHint" class="muted" style="margin:-.25rem 0 .85rem;font-size:.85rem" hidden></p>

    <div id="resetFormWrap">
      <form id="resetForm">
        <div class="field">
          <label for="rpEmail">Account email</label>
          <input id="rpEmail" type="email" required placeholder="you@email.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="rpCode">6-digit reset code</label>
          <input id="rpCode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" required placeholder="e.g. 482910" autocomplete="one-time-code" spellcheck="false" />
        </div>
        <div class="field">
          <label for="rpPass">New password</label>
          <input id="rpPass" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="rpPass2">Confirm new password</label>
          <input id="rpPass2" type="password" required minlength="6" placeholder="Same password again" autocomplete="new-password" />
        </div>
        <p id="authError" class="auth-error" hidden role="alert"></p>
        <button class="btn btn-primary" style="width:100%" type="submit" id="rpSubmit">Set new password</button>
      </form>
    </div>

    <div id="resetSuccess" hidden>
      <div class="auth-success" style="margin:0 0 1rem">
        <strong>✓ Password changed successfully</strong>
        <p style="margin:.5rem 0 0;font-size:.9rem">Taking you to the login page…</p>
      </div>
      <a class="btn btn-primary" style="width:100%;display:inline-flex;justify-content:center;text-decoration:none;box-sizing:border-box" href="/signin.html?reset=1">Go to login now</a>
    </div>

    <p class="muted" style="margin:1.15rem 0 0;text-align:center;font-size:.9rem">
      Need a new code? <a href="/forgot-password.html"><strong>Send again</strong></a>
      · <a href="/signin.html">Sign in</a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/assets/js/firebase-config.js?v=otp4"></script>
<script src="/assets/js/email-config.js?v=otp4"></script>
<script src="/assets/js/backend.js?v=otp4"></script>
<script src="/assets/js/email-otp.js?v=otp4"></script>
<script src="/assets/js/i18n.js?v=i18n1"></script>
<script src="/assets/js/password-reset.js?v=otp4"></script>
</body>
</html>
