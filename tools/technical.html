<div class="grid-2" style="margin-bottom:1rem">
  <div class="field"><label>Asset</label><select id="techAsset"></select></div>
  <div class="kpi-row" style="margin:0">
    <div class="card kpi"><strong id="techPrice">—</strong><span>Last</span></div>

    <div class="card kpi"><strong id="techSignal">—</strong><span>Signal</span></div>
  </div>
</div>
<div class="card wx-chart-shell" style="padding:0.85rem;margin-bottom:0.5rem">
  <div class="chart-toolbar wx-chart-bar" style="margin-bottom:0.5rem">
    <span class="muted wx-chart-credit" style="font-size:.78rem">TradingView · technical chart</span>
    <div class="wx-chart-actions">
      <button type="button" class="wx-chart-btn" data-chart-action="minimize" title="Minimize chart" aria-label="Minimize">−</button>
      <button type="button" class="wx-chart-btn" data-chart-action="expand" title="Expand chart" aria-label="Expand">⛶</button>
    </div>
  </div>
  <div class="wx-chart-stage chart-box" data-chart-stage style="height:400px">
    <div id="techChart" class="tv-host" aria-label="TradingView technical chart"></div>
  </div>
</div>
<p class="muted" style="font-size:.82rem;margin-top:.6rem">Powered by TradingView Advanced Chart. Expand for full-screen analysis.</p>
