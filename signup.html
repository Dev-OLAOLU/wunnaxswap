<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="signup_title">Sign Up | Wunnaxswap</title>
  <meta name="theme-color" content="#F6F5F3" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="assets/css/main.css?v=i18n1" />
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="card auth-box">
    <div class="auth-lang-row">
      <label class="wx-lang-wrap">
        <span class="wx-lang-caption" data-i18n="lang">Language</span>
        <select class="wx-lang-select" data-lang-select aria-label="Language">
          <option value="en">English (EN)</option>
          <option value="es">Español (ES)</option>
          <option value="fr">Français (FR)</option>
          <option value="zh">中文 (ZH)</option>
          <option value="ar">العربية (AR)</option>
          <option value="hi">हिन्दी (HI)</option>
          <option value="pt">Português (PT)</option>
          <option value="de">Deutsch (DE)</option>
          <option value="ja">日本語 (JA)</option>
          <option value="ko">한국어 (KO)</option>
        </select>
      </label>
    </div>
    <a class="brand auth-brand" href="/index.html"><span class="brand-mark">WX</span> Wunnaxswap</a>
    <h1 data-i18n="signup_title">Create account</h1>
    <p class="muted" data-i18n="signup_sub">Pick email + password (min 6 chars). Success → home page.</p>

    <form id="signupForm">
      <div class="field">
        <label for="suName" data-i18n="signup_name">Full name</label>
        <input id="suName" required placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="suEmail" data-i18n="signup_email">Email</label>
        <input id="suEmail" type="email" required placeholder="you@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="suPass" data-i18n="signup_pass">Create password</label>
        <input id="suPass" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="suPass2" data-i18n="signup_pass2">Confirm password</label>
        <input id="suPass2" type="password" required minlength="6" placeholder="Same password again" autocomplete="new-password" />
      </div>
      <div class="checkline">
        <input type="checkbox" required id="suTerms" />
        <span data-i18n="signup_terms">I agree to the Terms</span>
      </div>
      <p id="authError" class="auth-error" hidden role="alert"></p>
      <button class="btn btn-primary" style="width:100%" type="submit" data-i18n="signup_submit">Create account</button>
    </form>

    <div class="auth-divider" data-i18n="or">or</div>

    <button type="button" class="btn btn-social google" id="btnGoogle" data-provider="google" style="width:100%">
      <span data-i18n="signup_google">Continue with Google</span>
    </button>

    <p class="muted" style="margin:1.15rem 0 0;text-align:center;font-size:.9rem">
      <span data-i18n="signup_have">Already have an account?</span>
      <a href="/signin.html"><strong data-i18n="signup_signin">Sign in</strong></a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/assets/js/i18n.js?v=i18n1"></script>
<script src="/assets/js/firebase-config.js?v=i18n1"></script>
<script src="/assets/js/backend.js?v=i18n1"></script>
<script src="/assets/js/auth-page.js?v=i18n1"></script>
</body>
</html>
