<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign Up | Wunnaxswap</title>
  <meta name="theme-color" content="#F6F5F3" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.png" type="image/png" sizes="32x32" />
  <link rel="stylesheet" href="assets/css/main.css?v=markos1" />
</head>
<body class="auth-page">

<div class="auth-wrap">
  <div class="card auth-box">
    <a class="brand auth-brand" href="/index.html"><span class="brand-mark">WX</span> Wunnaxswap</a>
    <h1>Create account</h1>
    <p class="muted">Pick email + password (min 6 chars). Success → home page.</p>

    <form id="signupForm">
      <div class="field">
        <label for="suName">Full name</label>
        <input id="suName" required placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label for="suEmail">Email</label>
        <input id="suEmail" type="email" required placeholder="you@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="suPass">Create password</label>
        <input id="suPass" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="suPass2">Confirm password</label>
        <input id="suPass2" type="password" required minlength="6" placeholder="Same password again" autocomplete="new-password" />
      </div>
      <div class="checkline">
        <input type="checkbox" required id="suTerms" />
        <span>I agree to the Terms</span>
      </div>
      <p id="authError" class="auth-error" hidden role="alert"></p>
      <button class="btn btn-primary" style="width:100%" type="submit">Create account</button>
    </form>

    <div class="auth-divider">or</div>

    <button type="button" class="btn btn-social google" id="btnGoogle" data-provider="google" style="width:100%">
      Continue with Google
    </button>

    <p class="muted" style="margin:1.15rem 0 0;text-align:center;font-size:.9rem">
      Already have an account? <a href="/signin.html"><strong>Sign in</strong></a>
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="/assets/js/firebase-config.js?v=glogin6"></script>
<script src="/assets/js/backend.js?v=glogin6"></script>
<script src="/assets/js/auth-page.js?v=glogin6"></script>
</body>
</html>
